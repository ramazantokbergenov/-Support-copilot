<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support Copilot — ZHS</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#667085;--bd:#e3e6eb;--ac:#4f46e5;--acs:#eef0ff;--rd:#b42318;--rds:#fef0ee;--gr:#067647;--grs:#e8f7ef;--am:#b54708;--ams:#fff4e5;--bl:#175cd3;--bls:#e8f0fe;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141a;--card:#1b1e27;--tx:#e8eaf0;--mu:#9aa3b5;--bd:#2c303c;--ac:#8b86ff;--acs:#262a4a;--rd:#ff8a7a;--rds:#3a1f1c;--gr:#4ade9a;--grs:#14301f;--am:#fbbf5c;--ams:#35280f;--bl:#7fb0ff;--bls:#1b2a47}color-scheme:dark}
:root[data-theme=dark]{--bg:#12141a;--card:#1b1e27;--tx:#e8eaf0;--mu:#9aa3b5;--bd:#2c303c;--ac:#8b86ff;--acs:#262a4a;--rd:#ff8a7a;--rds:#3a1f1c;--gr:#4ade9a;--grs:#14301f;--am:#fbbf5c;--ams:#35280f;--bl:#7fb0ff;--bls:#1b2a47;color-scheme:dark}
:root{box-sizing:border-box;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
*{box-sizing:border-box}html{scroll-padding-top:var(--safe-t)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-weight:700;font-size:16px}.logo b{color:var(--ac)}
.tag{font-size:12px;color:var(--mu)}header .sp{flex:1}
button,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--bd);background:var(--card);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.p:hover{opacity:.9}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px 20px;max-width:1280px;margin:0 auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:12px}}
.side{display:flex;flex-direction:column;gap:10px}
.new{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
textarea{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:8px;resize:vertical}
.new .btn{margin-top:8px;width:100%}
.t{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;cursor:pointer}
.t.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.t .r{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.t p{margin:4px 0 6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.b{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;font-weight:600;background:var(--acs);color:var(--ac)}
.b.urgent{background:var(--rds);color:var(--rd)}.b.high{background:var(--ams);color:var(--am)}.b.normal{background:var(--bls);color:var(--bl)}.b.low{background:var(--grs);color:var(--gr)}
.main{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.alert{background:var(--rds);border:1px solid var(--rd);border-radius:12px;padding:12px 16px}
.alert.ok{background:var(--grs);border-color:var(--gr)}
.alert b{color:var(--rd)}.alert.ok b{color:var(--gr)}
.alert ul{margin:6px 0 0;padding-left:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:5px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.col{border-radius:10px;padding:10px 12px;border:1px solid var(--bd)}
.col h4{margin:0 0 6px;font-size:12px}
.col.cl{background:var(--ams)}.col.cl h4{color:var(--am)}
.col.ev{background:var(--bls)}.col.ev h4{color:var(--bl)}
.col.vf{background:var(--grs)}.col.vf h4{color:var(--gr)}
.col.un{background:var(--bg)}.col.un h4{color:var(--mu)}
.col ul{margin:0;padding-left:16px}.col .e{color:var(--mu);font-style:italic}
.ref{border-left:3px solid var(--ac);padding:6px 10px;margin:6px 0;background:var(--bg);border-radius:0 8px 8px 0}
.ref a{color:var(--ac);word-break:break-all}.ref small{color:var(--mu);display:block}
.ref.w{border-color:var(--am)}
.meter{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;width:140px}.meter i{display:block;height:100%;background:var(--ac)}
.draft{border:2px dashed var(--ac);border-radius:10px;padding:10px;background:var(--bg)}
.draft textarea{min-height:170px;background:transparent;border:0;padding:0}
pre{margin:0;overflow:auto;font-size:12px;background:var(--bg);padding:10px;border-radius:8px;max-height:360px}
.q li{margin:2px 0}
.note{font-size:12px;color:var(--mu)}
</style></head><body>
<header>
 <div class="logo">Support <b>Copilot</b></div><span class="tag">Grand Mobile · Decentrathon 6.0 · Команда ZHS · v1.0</span><span class="sp"></span>
 <button class="btn" id="th">◐ Тема</button>
</header>
<div class="wrap">
 <aside class="side">
  <div class="new"><textarea id="nt" rows="3" placeholder="Вставьте текст нового обращения…"></textarea><button class="btn p" id="an">Обработать обращение</button></div>
  <div id="list" class="side"></div>
 </aside>
 <section class="main" id="main"></section>
</div>
<script>
const R={
 appeal:{t:"Обжалование санкций",n:"—",u:"11071819",d:"11.04.2025"},
 proc:{t:"Процесс подачи апелляции",n:"—",u:"11071824",d:"11.04.2025"},
 chat:{t:"II. Правила общения и использования чатов",n:"—",u:"12974295",d:"28.06.2026"},
 adm:{t:"III. Взаимодействие с администрацией",n:"— (срок жалобы: 2 дня)",u:"12974298",d:"28.06.2026"},
 acc:{t:"IV. Аккаунты и персонажи",n:"—",u:"12974300",d:"28.06.2026"},
 gen:{t:"I. Общие положения проекта",n:"—",u:"12974291",d:"28.06.2026"},
 game:{t:"V. Правила игрового процесса",n:"V.5.2 (предположительно, требует сверки)",u:"12974302",d:"28.06.2026"},
 compl:{t:"Жалобы на игроков",n:"—",u:"11071798",d:"11.04.2025"}
};
const CATS={appeal_ban:"Appeal / Ban",player_report:"Player Report",admin_complaint:"Admin Complaint",account_security:"Account Security / Theft",payment:"Payment / Purchase",bug:"Bug / Technical",other:"Other / Unclear"};
const Q={
 appeal_ban:["Сервер и ник/ID персонажа","Дата и время санкции","Тип и срок санкции, указанная причина","Номер жалобы/санкции","Какие доказательства есть у вас"],
 player_report:["Точная дата и время","Сервер","Ник нарушителя","Скриншот или видео"],
 admin_complaint:["Ник/ID администратора","Номер обращения или санкции","Дата выдачи наказания"],
 account_security:["Ник/ID и сервер","Когда вы потеряли доступ","Какие предметы пропали","Подозреваете ли передачу данных третьим лицам"],
 payment:["Подтверждение платежа","Дата и сумма","Ник/ID и сервер"],
 bug:["Описание шагов воспроизведения","Устройство и версия клиента","Скриншот/видео"],
 other:["Что именно произошло?","На каком сервере и с каким персонажем?","Что вы хотите получить в итоге?"]};
const REFS={appeal_ban:["appeal","proc"],player_report:["chat","compl"],admin_complaint:["adm","appeal"],account_security:["gen","acc"],payment:[],bug:[],other:[]};
const T=[
{id:"T1",text:"Меня заблокировали на 30 дней, я не согласен.",lang:"ru",cat:"appeal_ban",pri:"high",
 summary:"Игрок оспаривает блокировку. Срок 30 дней — со слов игрока.",claims:["Заблокирован на 30 дней","Не согласен с наказанием"],evid:[],ver:[],unk:["Сервер, ник/ID","Дата и причина блокировки","Номер жалобы"],
 reasons:["Оспаривается бан — нужна проверка логов и решение администратора","Не хватает критичных данных"],conf:.86,
 analysis:"Типичная апелляция. Процедура обжалования найдена в официальных материалах; решение о снятии санкции принимает только администрация."},
{id:"T2",text:"Игрок оскорблял меня в чате.",lang:"ru",cat:"player_report",pri:"normal",
 summary:"Жалоба на оскорбления в чате. Факт нарушения не подтверждён.",claims:["Другой игрок оскорблял в чате"],evid:[],ver:[],unk:["Ник нарушителя","Дата/время, сервер","Текст сообщений"],
 reasons:["Обвинение без проверяемых доказательств","Не хватает критичных данных"],conf:.82,
 analysis:"Релевантен раздел II (правила общения). Нарушение не объявляется доказанным — нужны скриншот/видео."},
{id:"T3",text:"Администратор выдал мне наказание несправедливо.",lang:"ru",cat:"admin_complaint",pri:"high",
 summary:"Жалоба на действия администратора. Администратор и санкция не указаны.",claims:["Наказание выдано несправедливо"],evid:[],ver:[],unk:["Какой администратор","Номер санкции","Дата"],
 reasons:["Оспаривается наказание — нужно решение администрации","Не хватает критичных данных"],conf:.78,
 analysis:"По разделу III жалобы на администраторов подаются в течение двух дней после наказания — срок нужно проверить оператору. Закрывать обращение автоматически нельзя."},
{id:"T4",text:"Кто-то вошёл в мой аккаунт и забрал вещи.",lang:"ru",cat:"account_security",pri:"urgent",
 summary:"Предполагаемый взлом аккаунта и потеря предметов.",claims:["Посторонний вошёл в аккаунт","Предметы пропали"],evid:[],ver:[],unk:["Дата доступа","Список предметов","Как мог произойти взлом"],
 reasons:["Обвинение во взломе/краже без доказательств","Ответ мог бы обещать возврат имущества — запрещено"],conf:.8,
 analysis:"Общие положения возлагают на игрока ответственность за сохранность аккаунта, но это не основание для автоотказа. Возврат имущества не обещать."},
{id:"T5",text:"Игрок использует стороннюю программу.",lang:"ru",cat:"player_report",pri:"normal",
 summary:"Подозрение на читы у другого игрока.",claims:["Игрок использует стороннее ПО"],evid:[],ver:[],unk:["Ник игрока","Сервер, время","Видео/скриншот"],
 reasons:["Обвинение в читерстве без доказательств"],conf:.8,refs:["game","compl"],
 analysis:"Потенциально применим пункт V.5.2 — требует сверки с лаунчером. Использование читов без проверки не подтверждается."},
{id:"T6",text:"Помогите, меня обидели.",lang:"ru",cat:"other",pri:"low",
 summary:"Обращение слишком неопределённое для категоризации.",claims:["Игрока «обидели» (детали неизвестны)"],evid:[],ver:[],unk:["Кто, где, когда","Чего хочет игрок"],
 reasons:["Низкая уверенность модели","Не хватает критичных данных","Возможна опасная ситуация — нужно уточнить"],conf:.31,
 analysis:"Правило без контекста не цитируется. Сначала нужны уточняющие вопросы."}];
let cur=0,tab="card";const $=s=>document.getElementById(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ul=a=>a.length?"<ul>"+a.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":'<span class="e">нет данных</span>';
function draftFor(t){
 const q=Q[t.cat].map(x=>"— "+x).join("\n");
 const ex=t.cat=="account_security"?"\nОбращаем внимание: мы не можем гарантировать возврат имущества — этот вопрос рассматривает администрация.\n":"";
 return `Здравствуйте!\n\nСпасибо за обращение. Мы приняли его в работу и передали специалисту для проверки. Чтобы ускорить рассмотрение, пришлите, пожалуйста:\n${q}\n${ex}\nПосле получения данных обращение рассмотрит сотрудник поддержки.\n\n[ЧЕРНОВИК — требует проверки оператором]`;}
function build(t){t.refs=t.refs||REFS[t.cat];t.draft=t.draft||draftFor(t);t.checked=false;t.status=t.status||"new";return t}
T.forEach(build);
function list(){$("list").innerHTML=T.map((t,i)=>`<div class="t ${i==cur?"on":""}" data-i="${i}"><div class="r"><b>${t.id}</b><span class="b ${t.pri}">${t.pri}</span></div><p>${esc(t.text)}</p><span class="b">${CATS[t.cat]}</span> ${t.reasons.length?'<span class="b urgent">human review</span>':""}</div>`).join("");
 document.querySelectorAll(".t").forEach(e=>e.onclick=()=>{cur=+e.dataset.i;tab="card";render()})}
function render(){list();const t=T[cur];
 const refs=t.refs.length?t.refs.map(k=>{const r=R[k];return `<div class="ref w"><b>${esc(r.t)}</b><small>Пункт: ${esc(r.n)} · версия источника: ${r.d}</small><small>Точная выдержка: не загружена — требуется верификация по тексту правил/лаунчеру, как факт не использовать</small><a href="https://support.grnd.gg/ru/articles/${r.u}" target="_blank" rel="noopener">support.grnd.gg/ru/articles/${r.u}</a></div>`}).join(""):'<span class="e">Подходящих материалов в реестре нет — система не подставляет правило. Требуются официальные материалы.</span>';
 const json=JSON.stringify({ticket_id:t.id,language:t.lang,category:t.cat,priority:t.pri,summary:t.summary,player_claims:t.claims,provided_evidence:t.evid,verified_data:t.ver,unknowns:t.unk,missing_information_questions:Q[t.cat],rule_references:t.refs.map(k=>({document_title:R[k].t,rule_number:R[k].n,exact_excerpt:null,source_url:"https://support.grnd.gg/ru/articles/"+R[k].u,source_version_date:R[k].d})),analysis:t.analysis,draft_reply:t.draft,human_review_required:t.reasons.length>0,escalation_reasons:t.reasons,confidence:t.conf},null,2);
 $("main").innerHTML=`
 <div class="alert ${t.reasons.length?"":"ok"}"><b>${t.reasons.length?"⚠ HUMAN_REVIEW_REQUIRED":"✓ Эскалация не требуется"}</b>${t.reasons.length?"<ul>"+t.reasons.map(r=>"<li>"+esc(r)+"</li>").join("")+"</ul>":""}</div>
 <div class="card"><div class="row"><b>${t.id}</b><span class="note">язык: ${t.lang}</span>
  <label>Категория <select id="cs">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k==t.cat?"selected":""}>${v}</option>`).join("")}</select></label>
  <label>Приоритет <select id="ps">${["low","normal","high","urgent"].map(p=>`<option ${p==t.pri?"selected":""}>${p}</option>`).join("")}</select></label>
  <span class="sp" style="flex:1"></span><span class="note">Уверенность ${Math.round(t.conf*100)}%</span><div class="meter"><i style="width:${t.conf*100}%"></i></div>
  <button class="btn" id="tg">${tab=="card"?"{ } JSON":"← Карточка"}</button></div>
  <p style="margin:10px 0 0"><i>«${esc(t.text)}»</i></p></div>
 ${tab=="json"?`<div class="card"><h3>Структура ответа AI</h3><pre>${esc(json)}</pre></div>`:`
 <div class="card"><h3>Сводка</h3>${esc(t.summary)}</div>
 <div class="grid">
  <div class="col cl"><h4>PLAYER_CLAIM · утверждения игрока</h4>${ul(t.claims)}</div>
  <div class="col ev"><h4>ATTACHMENT · доказательства</h4>${ul(t.evid)}</div>
  <div class="col vf"><h4>VERIFIED_SYSTEM_DATA</h4>${ul(t.ver)}</div>
  <div class="col un"><h4>UNKNOWN · неизвестно</h4>${ul(t.unk)}</div></div>
 <div class="card q"><h3>Недостающие данные — вопросы игроку</h3>${ul(Q[t.cat])}</div>
 <div class="card"><h3>Ссылки на официальные правила</h3>${refs}<p class="note">Выдержки без номера пункта и точной цитаты не показываются как факт.</p></div>
 <div class="card"><h3>Анализ</h3>${esc(t.analysis)}</div>
 <div class="card"><h3>Черновик ответа (${t.lang}) — не отправляется автоматически</h3><div class="draft"><textarea id="dr">${esc(t.draft)}</textarea></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="rg">Пересоздать</button><button class="btn p" id="ok">${t.checked?"✓ Проверено оператором":"Отметить как проверено"}</button><span class="note">Решение принимает оператор.</span></div></div>`}`;
 $("tg").onclick=()=>{tab=tab=="card"?"json":"card";render()};
 $("cs").onchange=e=>{t.cat=e.target.value;t.refs=REFS[t.cat];t.draft=draftFor(t);render()};
 $("ps").onchange=e=>t.pri=e.target.value;
 if(tab=="card"){$("dr").oninput=e=>t.draft=e.target.value;$("rg").onclick=()=>{t.draft=draftFor(t);render()};$("ok").onclick=()=>{t.checked=!t.checked;render()}}}
function classify(x){x=x.toLowerCase();
 if(/бан|заблок|мут|варн|warn|jail|тюрьм/.test(x))return"appeal_ban";
 if(/админ/.test(x))return"admin_complaint";
 if(/взлом|взлом|аккаунт|украл|вошёл|вошел/.test(x))return"account_security";
 if(/чит|программ|скрипт|оскорб|чат|мошен|обман/.test(x))return"player_report";
 if(/платёж|платеж|донат|покупк|оплат/.test(x))return"payment";
 if(/баг|ошибк|вылет|не загруж|лаг/.test(x))return"bug";return"other"}
$("an").onclick=()=>{const v=$("nt").value.trim();if(!v)return;const c=classify(v);
 const hi=c=="other"?.35:.7;
 const t=build({id:"N"+(T.length+1),text:v,lang:/[іқңғүұһә]/i.test(v)?"kk":/[ʼ‘]|o'|g'/i.test(v)?"uz":"ru",cat:c,pri:c=="account_security"?"urgent":c=="appeal_ban"||c=="admin_complaint"?"high":"normal",
  summary:"Автоматическая предварительная классификация (демо-эвристика). Требует проверки оператором.",claims:[v],evid:[],ver:[],unk:["Сервер, ник/ID","Дата и время","Доказательства"],
  reasons:c=="other"?["Низкая уверенность модели","Не хватает критичных данных"]:["Не хватает критичных данных","Утверждения игрока не подтверждены"],conf:hi,
  analysis:"Демо-режим: вместо LLM используется простая эвристика по ключевым словам. В боевой версии здесь работает AI-конвейер и retrieval по правилам."});
 T.unshift(t);cur=0;tab="card";$("nt").value="";render()};
$("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme=="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
render();
</script></body></html>
